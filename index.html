<!DOCTYPE html>
<html lang="en" translate="no">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="icon" href="./assets/img/6_salsa_flasche/2_salsa_bottle_on_ground.png" type="image/png" sizes="16x16">
    <link rel="stylesheet" href="./style.css">
</head>

<!-- <body onload="init()"> -->

<body>
    <!-- === STARTBILDSCHIRM (Intro) === -->
    <div id="startScreen">

        <!-- === Menüleiste oben === -->
        <nav id="startMenu">
            <button class="menuButton" onclick="startGame()">START</button>
            <button class="menuButton" onclick="openAudioSettings()">AUDIO</button>
            <button class="menuButton" onclick="openImpressum()">IMPRESSUM & THANKS</button>
            <button class="menuButton" onclick="openHighscore()">HIGHSCORE</button>
        </nav>


        <!-- === Startbild === -->
        <img src="./assets/img/9_intro_outro_bildschirm/start/startscreen_2.png" alt="Startscreen" id="startImage">

        <!-- === ÜBERLAGERUNGS-BILDER === -->
        <img src="./assets/img/9_intro_outro_bildschirm/start/bat.png" alt="Fledermaus" class="overlayImage"
            id="batImage">

        <!-- === COPYRIGHT jetzt innerhalb des Startbildschirms === -->
        <p id="copyright">(C) Jürgen Malinowski, Oktober 2025</p>

    </div>

    <!-- === HIGHSCORE-OVERLAY (wird per Klick angezeigt) === -->
    <div id="highscoreOverlay" onclick="closeHighscore()" style="display:none;">
        <div id="highscoreBox">
            <h2>🏆 H i g h s c o r e 🏆</h2>
            <div id="highscoreContent"></div>
            <p id="closeHint">Click to close</p>
        </div>
    </div>

    <!-- === HIGHSCORE-SAVED OVERLAY (Bestätigung nach Speichern) === -->
    <div id="highscoreSavedOverlay" onclick="closeHighscoreSaved()" style="display:none;">
        <div id="highscoreSavedBox" onclick="event.stopPropagation()">
            <h2>✅ Your Score was saved</h2>
            <p>Your score has been added to the high score list.</p>
            <button id="closeHighscoreSavedButton" onclick="closeHighscoreSaved()">OK</button>
        </div>
    </div>


    <!-- === AUDIO-OVERLAY === -->
    <div id="audioOverlay" onclick="closeAudioSettings()">
        <div id="audioBox" onclick="event.stopPropagation()">
            <h2>🎧 Audio Einstellungen</h2>

            <!-- Musik -->
            <div class="audioControlRow">
                <label for="musicVolume">Musiklautstärke:</label>
                <input type="range" id="musicVolume" min="0" max="1" step="0.05" value="0.3"
                    onchange="updateMusicVolume(this.value)">
            </div>

            <!-- Effekte -->
            <div class="audioControlRow">
                <label for="effectVolume">Effektlautstärke:</label>
                <input type="range" id="effectVolume" min="0" max="1" step="0.05" value="1"
                    onchange="updateEffectVolume(this.value)">
            </div>

            <div class="audioControlRow">
                <button id="toggleMuteButton" onclick="toggleMuteAll()">🔇 Ton an/aus</button>
            </div>

            <p id="closeAudioHint" onclick="closeAudioSettings()">Click to close</p>
        </div>
    </div>



    <!-- === IMPRESSUM & THANKS OVERLAY === -->
    <div id="impressumOverlay" onclick="closeImpressum()">
        <div id="impressumBox" onclick="event.stopPropagation()">
            <iframe id="impressumFrame" src="" title="Impressum & Thanks"></iframe>
            <!-- Button/Hinweis bekommt jetzt eigenen Klick-Handler -->
            <p id="closeImpressumHint" onclick="closeImpressum()">Click to close</p>
        </div>
    </div>




    <h1>EL POLLO LOCO</h1>

    <canvas id="canvas" width="720" height="480">

    </canvas>

</body>
